# L2 orchestrator config -- live bench (tracked in git since 2026-11-16). Generated 2026-07-28.
#   .venv/bin/python -m orchestrator --config orchestrator/config.toml serve
#
# This file is the ONLY address book (spec section 2). This NUC is nuc1,
# hostname innocorecontroller-NUC14MNK-B2, LAN address 192.168.0.126 --
# note the bench is on 192.168.0.0/24, NOT the 192.168.1.0/24 the
# config.toml.example placeholders assumed.

[orchestrator]
host = "0.0.0.0"
port = 17100
log_dir = "runs"
status_poll_s = 1.0
step_timeout_s = 30.0
connect_timeout_s = 5.0
retry_delay_s = 1.0

# Ask the operator before the run's first hardware-acting step. The linear
# rail has no software stop (docs/L1_AUDIT.md GAP-1/GAP-9), so this stays
# on for every bench run.
confirm_first_motion = true

stop_on_failure = true

hazard_prefixes = [
    "gantry/", "linear/", "zstage/", "stage/",
    "pump/", "hotplate/", "lamp/", "arm/",
]

# --- Cells ----------------------------------------------------------------
# cell1 and cell4 are both served by this same NUC, so they are addressed
# over loopback; the LAN address 192.168.0.126 works too. cell2 and cell3
# live on nuc2 at 192.168.0.120 -- the earlier 192.168.0.20 here was a
# placeholder, not that NUC's address.

# Re-registered 2026-08-13 for the synthesis-chain run: the rail carries
# the balance/vial between the gantry cells, so cell4 is back in the
# address book together with its server. Running it means the MINAS amp
# is powered again, which brings back the LP #20 conducted-EMI storm --
# the rail workaround (hand-park the carriage near home, split long
# moves into <=50 mm segments) is documented in the synthesis scenario.
[cells.cell4]                # balance + MINAS A6 linear rail (NUC1)
base_url = "http://127.0.0.1:17060"
nuc = "nuc1"

[cells.cell1]                # Cell A -- X1/Z2 gantry (NUC1) -- LIVE
base_url = "http://127.0.0.1:17054"
nuc = "nuc1"

# cell2 and cell3 are served on nuc2 by
# claude_test/test_gantry_server_shinyeong.py, not `python -m server`:
# MKSMotor.open_xz names only the X adapter and takes whichever two of the
# bus's remaining FTDI adapters it finds, which on nuc2's seven-adapter bus
# picks up another cell's Z motors -- and makes running both gantries at
# once impossible. The launcher names all three adapters per cell instead.
# Neither has its syringe pump on the bench, so /v1/pump/* answers 409.

[cells.cell2]                # Cell B -- X1/Z2 gantry (NUC2) -- LIVE
base_url = "http://192.168.0.120:17056"
nuc = "nuc2"

[cells.cell3]                # Cell C -- X1/Z2 gantry (NUC2) -- LIVE
base_url = "http://192.168.0.120:17058"
nuc = "nuc2"

# cell5's motor power is not connected (its zstage adapter NTB3EP5R
# enumerates but the motor does not answer an encoder read), so it is left
# unregistered. Registering an unreachable cell costs every abort and every
# stop_on_failure broadcast a connect timeout apiece -- the engine sends
# POST /v1/stop to every registered cell, not only the ones a run touched.
# Restore this block when Cell D is powered.
# [cells.cell5]              # Cell D -- pump + Z + hotplate + lamp (NUC2)
# base_url = "http://192.168.0.120:17062"
# nuc = "nuc2"

# FR5 arm, synthesis stage (controller 192.168.0.58). Served from this
# NUC during the 2026-08-11 bring-up, so loopback.
[cells.cell6]
base_url = "http://127.0.0.1:17064"
nuc = "nuc2"

# FR5 arm, analysis stage (controller 192.168.0.59). Read clean on
# 2026-08-11 while cell6's controller was faulted.
[cells.cell7]
base_url = "http://127.0.0.1:17066"
nuc = "nuc1"

[cells.cell5]                # Cell 5 -- analysis pump + ball-screw Z (NUC2) -- LIVE 2026-10-12
# Served by claude_test/test_cell5_server_shinyeong.py (pump + Z, hotplate
# absent), not `python -m server`, which refuses to start without the IKA RCT.
base_url = "http://192.168.0.120:17062"
nuc = "nuc2"
