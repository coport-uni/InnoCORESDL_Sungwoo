# Analysis tail only — 2026-09-30. The cell7 part of
# test_synthesis_to_analysis_shinyeong.yaml (arm7_enable .. verify_end_state)
# with a pre-flight that refuses to start unless cell4 already reads
# rail_end_mm and all three heads are up. Params are copied from that file;
# keep them in step.
name: test_analysis_tail_shinyeong
description: 'Analysis hand-off only: the cell7 tail of test_synthesis_to_analysis_shinyeong, for re-running
  after a synthesis stage that already left the rail at rail_end_mm with the vial on the balance.'
params:
  program: Task1_original.lua
  arm_last_line: 29
  arm_min_elapsed_s: 20.0
  analysis_program_vial: pick_and_place_vial.lua
  analysis_program_head: pick_and_place_head.lua
  analysis_vial_last_line: 25
  analysis_vial_min_s: 10.0
  analysis_head_last_line: 31
  analysis_head_min_s: 10.0
  analysis_program_zensor: zensor.lua
  analysis_zensor_last_line: 16
  analysis_zensor_min_s: 10.0
  analysis_program_wash: ZensorWash.lua
  c5_z_dispense_mm: 421.0
  c5_z_tol_mm: 0.5
  c5_volume_uL: 50.0   # 2026-10-14: operator setting (one cycle holds at most 125 uL — the syringe)
  analysis_program_init_head: init_head.lua
  analysis_init_head_last_line: 28
  analysis_init_head_min_s: 10.0
  analysis_wash_last_line: 61
  analysis_wash_min_s: 55.0
  rail_home_mm: 17.98
  rail_cell1_mm: 491.752
  rail_cell2_mm: 729.246
  rail_cell3_mm: 947.5
  rail_end_mm: 978.0
  c1_x_mm: 249.985
  c1_z_mm: 225.0
  c2_x_mm: 250.004
  c2_z_mm: 225.0
  c3_x_mm: 243.0
  c3_z_mm: 223.0
  z_up_mm: 3.0
  volume_uL: 100.0
  source_port: 1
  dispense_port: 2
  init_force: 2
  rail_tol_mm: 2.0
  gantry_tol_mm: 0.5
  speed_pct: 10
  accel_pct: 0
defaults:
  on_fail: abort
  timeout_s: 30.0
steps:
- id: diag_cell7
  cell: cell7
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d7
- id: diag_cell4
  cell: cell4
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d4
- id: diag_cell1
  cell: cell1
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d1
- id: diag_cell2
  cell: cell2
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d2
- id: diag_cell3
  cell: cell3
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d3
- id: verify_arm7_ready
  assert: ${d7.arm.ok} == True and ${d7.arm.ready} == True and ${d7.program.running} == False
- id: verify_rail_and_balance
  assert: ${d4.stage.ok} == True and ${d4.balance.ok} == True
- id: pre_rail
  cell: cell4
  action: status
  method: GET
  timeout_s: 20.0
  save_as: pr
- id: verify_rail_at_end_pre
  assert: ${pr.stage_x_mm} - ${params.rail_end_mm} <= ${params.rail_tol_mm} and ${params.rail_end_mm}
    - ${pr.stage_x_mm} <= ${params.rail_tol_mm} and ${d1.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
    and ${d2.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${d3.stage.z_a_mm} <= ${params.z_up_mm}
    + ${params.gantry_tol_mm}
- id: diag_cell5
  cell: cell5
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d5
- id: verify_cell5
  assert: ${d5.pump.ok} == True and ${d5.stage.ok} == True and ${d5.ok_to_initialize} == True
- id: init_home_cell5
  cell: cell5
  action: zstage/home
  timeout_s: 180.0
  save_as: h5
- id: verify_init_cell5
  assert: ${h5.z_mm} <= ${params.c5_z_tol_mm}
- id: cell5_pump_init
  cell: cell5
  action: pump/initialize
  body:
    force: ${params.init_force}
  timeout_s: 60.0
  save_as: p5init
- id: verify_pump5_initialised
  assert: ${p5init.plunger_uL} == 0
- id: arm7_enable
  cell: cell7
  action: arm/enable
  save_as: en7
- id: verify_arm7_enabled
  assert: ${en7.fault_cleared} == True
- id: arm7_pick_and_place_vial
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_vial}
  timeout_s: 360.0
  save_as: prog7v
- id: verify_arm7_vial
  assert: ${prog7v.completed} == True and ${prog7v.last_line} >= ${params.analysis_vial_last_line} and
    ${prog7v.elapsed_s} >= ${params.analysis_vial_min_s}
- id: arm7_pick_and_place_head
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_head}
  timeout_s: 360.0
  save_as: prog7h
- id: verify_arm7_head
  assert: ${prog7h.completed} == True and ${prog7h.last_line} >= ${params.analysis_head_last_line} and
    ${prog7h.elapsed_s} >= ${params.analysis_head_min_s}
- id: arm7_zensor
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_zensor}
  timeout_s: 360.0
  save_as: prog7z
- id: verify_arm7_zensor
  assert: ${prog7z.completed} == True and ${prog7z.last_line} >= ${params.analysis_zensor_last_line} and
    ${prog7z.elapsed_s} >= ${params.analysis_zensor_min_s}
- id: cell5_z_dispense
  cell: cell5
  action: zstage/move
  body:
    z_mm: ${params.c5_z_dispense_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c5z
- id: verify_cell5_at_dispense
  assert: ${c5z.z_mm} - ${params.c5_z_dispense_mm} <= ${params.c5_z_tol_mm} and ${params.c5_z_dispense_mm}
    - ${c5z.z_mm} <= ${params.c5_z_tol_mm}
- id: cell5_dispense
  cell: cell5
  action: pump/cycle
  body:
    cycles: 1
    volume_uL: ${params.c5_volume_uL}
    source_port: ${params.source_port}
    dispense_port: ${params.dispense_port}
  timeout_s: 60.0
  save_as: disp5
- id: verify_dispensed5
  assert: ${disp5.cycles_done} == 1
- id: cell5_z_home
  cell: cell5
  action: zstage/home
  timeout_s: 180.0
  save_as: c5home
- id: verify_cell5_home
  assert: ${c5home.z_mm} <= ${params.c5_z_tol_mm}
- id: arm7_zensor_wash
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_wash}
  timeout_s: 360.0
  save_as: prog7w
- id: verify_arm7_wash
  assert: ${prog7w.completed} == True and ${prog7w.last_line} >= ${params.analysis_wash_last_line} and
    ${prog7w.elapsed_s} >= ${params.analysis_wash_min_s}
- id: arm7_init_head
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_init_head}
  timeout_s: 360.0
  save_as: prog7i
- id: verify_arm7_init_head
  assert: ${prog7i.completed} == True and ${prog7i.last_line} >= ${params.analysis_init_head_last_line}
    and ${prog7i.elapsed_s} >= ${params.analysis_init_head_min_s}
- id: shutdown_rail_home_and_gantry_init
  parallel:
  - id: rail_home_shutdown
    cell: cell4
    action: linear/move
    body:
      y_mm: ${params.rail_home_mm}
    timeout_s: 240.0
    on_fail: retry
    retries: 2
    save_as: railback
  - id: init_cell1_shutdown
    cell: cell1
    action: gantry/home
    timeout_s: 180.0
    save_as: h1end
  - id: init_cell2_shutdown
    cell: cell2
    action: gantry/home
    timeout_s: 180.0
    save_as: h2end
  - id: init_cell3_shutdown
    cell: cell3
    action: gantry/home
    timeout_s: 180.0
    save_as: h3end
- id: verify_shutdown
  assert: ${railback.y_mm} - ${params.rail_home_mm} <= ${params.rail_tol_mm} and ${params.rail_home_mm}
    - ${railback.y_mm} <= ${params.rail_tol_mm} and ${h1end.z_mm} <= ${params.gantry_tol_mm} and ${h2end.z_mm}
    <= ${params.gantry_tol_mm} and ${h3end.z_mm} <= ${params.gantry_tol_mm}
- id: final_rail
  cell: cell4
  action: status
  method: GET
  timeout_s: 20.0
  save_as: fr
- id: final_cell1
  cell: cell1
  action: status
  method: GET
  timeout_s: 20.0
  save_as: f1
- id: verify_end_state
  assert: ${fr.stage_x_mm} - ${params.rail_home_mm} <= ${params.rail_tol_mm} and ${params.rail_home_mm}
    - ${fr.stage_x_mm} <= ${params.rail_tol_mm} and ${f1.stage_z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
    and ${f1.stage_x_mm} <= ${params.gantry_tol_mm}
