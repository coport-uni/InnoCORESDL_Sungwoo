# Dispense-and-weigh, 2026-09-30. For each of cell1..cell3: rail to that
# station, tare, head over the vial, descend, initialize + dispense
# weigh_cycles x volume_uL (3 x 100 = 300 uL), retract, read the balance.
# Every position and tolerance is copied from test_synthesis_to_analysis_shinyeong.yaml
# — keep them in step. The rail comes home at the end. Each verify_zero_cellN
# reads the pan back after tare (tare's own reply is not a measurement,
# see demo_weigh_at_position.yaml). No arm, no cell7.
name: test_dispense_weigh_shinyeong
description: 'Density check: rail to each station (cell1..3), tare, dispense weigh_cycles x volume_uL into the vial
  on the balance, read the weight. Positions/params copied from test_synthesis_to_analysis_shinyeong.'
params:
  program: Task1_original.lua
  arm_last_line: 29
  arm_min_elapsed_s: 20.0
  analysis_program_vial: pick_and_place_vial.lua
  analysis_program_head: pick_and_place_head.lua
  analysis_vial_last_line: 25
  analysis_vial_min_s: 10.0
  analysis_head_last_line: 31
  analysis_head_min_s: 10.0
  analysis_program_zensor: zensor.lua
  analysis_zensor_last_line: 16
  analysis_zensor_min_s: 10.0
  analysis_program_wash: ZensorWash.lua
  analysis_program_init_head: init_head.lua
  analysis_wash_last_line: 61
  analysis_wash_min_s: 55.0
  rail_home_mm: 17.98
  rail_cell1_mm: 491.752
  rail_cell2_mm: 729.246
  rail_cell3_mm: 947.5
  rail_end_mm: 978.0
  c1_x_mm: 249.985
  c1_z_mm: 225.0
  c2_x_mm: 250.004
  c2_z_mm: 225.0
  c3_x_mm: 243.0
  c3_z_mm: 223.0
  z_up_mm: 3.0
  volume_uL: 100.0
  source_port: 1
  dispense_port: 2
  init_force: 2
  rail_tol_mm: 2.0
  gantry_tol_mm: 0.5
  speed_pct: 10
  accel_pct: 0
  weigh_cycles: 3
defaults:
  on_fail: abort
  timeout_s: 30.0
steps:
- id: diag_cell4
  cell: cell4
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d4
- id: diag_cell1
  cell: cell1
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d1
- id: diag_cell2
  cell: cell2
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d2
- id: diag_cell3
  cell: cell3
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d3
- id: verify_rail_and_balance
  assert: ${d4.stage.ok} == True and ${d4.balance.ok} == True
- id: verify_pumps
  assert: ${d1.pump.present} == True and ${d2.pump.present} == True and ${d3.pump.present} == True
- id: verify_all_gantries_up
  assert: ${d1.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${d1.stage.z_b_mm} <= ${params.z_up_mm}
    + ${params.gantry_tol_mm} and ${d2.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${d2.stage.z_b_mm}
    <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${d3.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
    and ${d3.stage.z_b_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
- id: rail_at_cell1
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_cell1_mm}
  timeout_s: 240.0
  save_as: rail1
- id: verify_rail_at_cell1
  assert: ${rail1.y_mm} - ${params.rail_cell1_mm} <= ${params.rail_tol_mm} and ${params.rail_cell1_mm} - ${rail1.y_mm}
    <= ${params.rail_tol_mm}
- id: tare_cell1
  cell: cell4
  action: balance/tare
  timeout_s: 30.0
- id: zero_cell1
  cell: cell4
  action: balance/weight
  method: GET
  timeout_s: 75.0
  save_as: z1
- id: verify_zero_cell1
  assert: ${z1.weight_g} <= 0.05 and 0.0 - ${z1.weight_g} <= 0.05
- id: cell1_x_over_vial
  cell: cell1
  action: gantry/move
  body:
    x_mm: ${params.c1_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c1x
- id: cell1_descend
  cell: cell1
  action: gantry/move
  body:
    x_mm: ${params.c1_x_mm}
    z_mm: ${params.c1_z_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 180.0
  save_as: c1z
- id: verify_cell1_descended
  assert: ${c1z.z_mm} - ${params.c1_z_mm} <= ${params.gantry_tol_mm} and ${params.c1_z_mm} - ${c1z.z_mm} <= ${params.gantry_tol_mm}
- id: cell1_pump_init
  cell: cell1
  action: pump/initialize
  body:
    force: ${params.init_force}
  timeout_s: 60.0
- id: cell1_dispense
  cell: cell1
  action: pump/cycle
  body:
    cycles: ${params.weigh_cycles}
    volume_uL: ${params.volume_uL}
    source_port: ${params.source_port}
    dispense_port: ${params.dispense_port}
  timeout_s: 120.0
  save_as: disp1
- id: verify_dispensed1
  assert: ${disp1.cycles_done} == ${params.weigh_cycles}
- id: cell1_retract
  cell: cell1
  action: gantry/move
  body:
    x_mm: ${params.c1_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c1r
- id: verify_cell1_clear
  assert: ${c1r.z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
- id: weigh_cell1
  cell: cell4
  action: balance/weight
  method: GET
  timeout_s: 75.0
  save_as: w1
- id: verify_weigh_cell1
  assert: ${w1.weight_g} > 0.05
- id: rail_at_cell2
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_cell2_mm}
  timeout_s: 240.0
  save_as: rail2
- id: verify_rail_at_cell2
  assert: ${rail2.y_mm} - ${params.rail_cell2_mm} <= ${params.rail_tol_mm} and ${params.rail_cell2_mm} - ${rail2.y_mm}
    <= ${params.rail_tol_mm}
- id: tare_cell2
  cell: cell4
  action: balance/tare
  timeout_s: 30.0
- id: zero_cell2
  cell: cell4
  action: balance/weight
  method: GET
  timeout_s: 75.0
  save_as: z2
- id: verify_zero_cell2
  assert: ${z2.weight_g} <= 0.05 and 0.0 - ${z2.weight_g} <= 0.05
- id: cell2_x_over_vial
  cell: cell2
  action: gantry/move
  body:
    x_mm: ${params.c2_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c2x
- id: cell2_descend
  cell: cell2
  action: gantry/move
  body:
    x_mm: ${params.c2_x_mm}
    z_mm: ${params.c2_z_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 180.0
  save_as: c2z
- id: verify_cell2_descended
  assert: ${c2z.z_mm} - ${params.c2_z_mm} <= ${params.gantry_tol_mm} and ${params.c2_z_mm} - ${c2z.z_mm} <= ${params.gantry_tol_mm}
- id: cell2_pump_init
  cell: cell2
  action: pump/initialize
  body:
    force: ${params.init_force}
  timeout_s: 60.0
- id: cell2_dispense
  cell: cell2
  action: pump/cycle
  body:
    cycles: ${params.weigh_cycles}
    volume_uL: ${params.volume_uL}
    source_port: ${params.source_port}
    dispense_port: ${params.dispense_port}
  timeout_s: 120.0
  save_as: disp2
- id: verify_dispensed2
  assert: ${disp2.cycles_done} == ${params.weigh_cycles}
- id: cell2_retract
  cell: cell2
  action: gantry/move
  body:
    x_mm: ${params.c2_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c2r
- id: verify_cell2_clear
  assert: ${c2r.z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
- id: weigh_cell2
  cell: cell4
  action: balance/weight
  method: GET
  timeout_s: 75.0
  save_as: w2
- id: verify_weigh_cell2
  assert: ${w2.weight_g} > 0.05
- id: rail_at_cell3
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_cell3_mm}
  timeout_s: 240.0
  save_as: rail3
- id: verify_rail_at_cell3
  assert: ${rail3.y_mm} - ${params.rail_cell3_mm} <= ${params.rail_tol_mm} and ${params.rail_cell3_mm} - ${rail3.y_mm}
    <= ${params.rail_tol_mm}
- id: tare_cell3
  cell: cell4
  action: balance/tare
  timeout_s: 30.0
- id: zero_cell3
  cell: cell4
  action: balance/weight
  method: GET
  timeout_s: 75.0
  save_as: z3
- id: verify_zero_cell3
  assert: ${z3.weight_g} <= 0.05 and 0.0 - ${z3.weight_g} <= 0.05
- id: cell3_x_over_vial
  cell: cell3
  action: gantry/move
  body:
    x_mm: ${params.c3_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c3x
- id: cell3_descend
  cell: cell3
  action: gantry/move
  body:
    x_mm: ${params.c3_x_mm}
    z_mm: ${params.c3_z_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 180.0
  save_as: c3z
- id: verify_cell3_descended
  assert: ${c3z.z_mm} - ${params.c3_z_mm} <= ${params.gantry_tol_mm} and ${params.c3_z_mm} - ${c3z.z_mm} <= ${params.gantry_tol_mm}
- id: cell3_pump_init
  cell: cell3
  action: pump/initialize
  body:
    force: ${params.init_force}
  timeout_s: 60.0
- id: cell3_dispense
  cell: cell3
  action: pump/cycle
  body:
    cycles: ${params.weigh_cycles}
    volume_uL: ${params.volume_uL}
    source_port: ${params.source_port}
    dispense_port: ${params.dispense_port}
  timeout_s: 120.0
  save_as: disp3
- id: verify_dispensed3
  assert: ${disp3.cycles_done} == ${params.weigh_cycles}
- id: cell3_retract
  cell: cell3
  action: gantry/move
  body:
    x_mm: ${params.c3_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c3r
- id: verify_cell3_clear
  assert: ${c3r.z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
- id: weigh_cell3
  cell: cell4
  action: balance/weight
  method: GET
  timeout_s: 75.0
  save_as: w3
- id: verify_weigh_cell3
  assert: ${w3.weight_g} > 0.05
- id: rail_home
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_home_mm}
  timeout_s: 240.0
  save_as: railback
- id: verify_rail_home
  assert: ${railback.y_mm} - ${params.rail_home_mm} <= ${params.rail_tol_mm} and ${params.rail_home_mm} - ${railback.y_mm}
    <= ${params.rail_tol_mm}
