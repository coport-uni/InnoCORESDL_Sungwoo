# ── NO-CELL1 VARIANT, made 2026-09-30 ──────────────────────────────────
# A COPY of test_synthesis_to_analysis_shinyeong.yaml with every cell1
# step removed: its pre-flight, its homing, the rail stop under it, its
# dispense block, its shutdown re-home and its end-state check. Made
# because cell1's X-axis adapter (NTAMU6TO) left NUC1 on 2026-09-17 16:22
# and has not come back, so cell1 cannot serve. Everything else — every
# position, tolerance, guard and the cell7 tail — is unchanged. The rail
# goes from home straight to the cell2 station (one 706 mm step).
# Generated from the original by id, so the per-step comments of the
# original are not carried over; read them there.
#
# The synthesis stage + hand-off to the analysis arm.
#
# A COPY of test_synthesis_seq_free_shinyeong.yaml, made 2026-09-16. Keep
# the two in step: every position, tolerance and guard above the rail's
# end move is the same, and the reasoning lives in that file's header.
# What differs is only the tail:
#
#   * rail_return_home / verify_rail_home are GONE. The rail stops at
#     rail_end_mm and stays, because that is where cell7 picks from.
#   * after the gantries park, cell7 runs two Lua programs in order:
#     pick_and_place_vial.lua, then pick_and_place_head.lua. Both were
#     confirmed present on the controller (claude_test/probe_arm_lua.py,
#     2026-09-15) and added to allowed_programs in server/nuc1/cell7.toml.
#   * cell7 is checked in the pre-flight, so a dead analysis arm stops the
#     run before four minutes of synthesis rather than after them.
#   * the rail comes home at the very end, but only after the analysis
#     work is done — and it does so WHILE the three gantries re-home, the
#     one parallel block in the chain (see the step for why that mix is
#     safe). The bench therefore ends in its starting state: rail at
#     rail_home_mm, every gantry zeroed at its switches.
#
# cell6 and cell7 are strictly sequential here — never in one parallel
# block until their reach overlap is measured (cell7.toml, GAP-8).
#
# ── header of the file this was copied from follows ─────────────────────
#
# The synthesis stage, end to end, RUN WITHOUT GATES — for filming.
#
# This is test_synthesis_seq_shinyeong.yaml with its five `pause` steps
# removed. Everything else is identical. Read that file's header for the
# reasoning behind every position and guard; only the differences are
# repeated here.
#
# DO NOT RUN THIS FIRST. docs/L1_BRINGUP.md §6 prescribes validate ->
# --step-mode -> free run for every scenario, and the gated form has a
# specific job on this chain that no assert can do:
#
#   cell2's and cell3's descent heights were NEVER TAUGHT ON THEIR OWN
#   FRAMES. They inherit cell1's 223.654 mm on the operator's judgement
#   that the three frames are built alike. The gated run is where a human
#   looks at the gap before the head commits. Run this free version only
#   after a --step-mode run has shown both of those descents clearing the
#   pan — after that the heights are measured rather than assumed, and
#   the film gets a clean take besides.
#
# What still protects the run once it starts:
#   * confirm_first_motion still gates the very first hazardous step, so
#     the run does not begin unattended;
#   * every rail move is preceded by an assert that the gantry which just
#     worked has its Z back at 0, and the pre-flight checks all three
#     heads are up before the rail moves at all;
#   * every move is verified against the encoder readback, and on_fail is
#     abort, so the first bad measurement ends the run.
# What is gone is the chance to look before each descent and before the
# dispense. THE RAIL STILL CANNOT BE STOPPED FROM SOFTWARE (GAP-1) — the
# physical e-stop is the only stop, and someone holds it for the whole
# take.
#
# ── original header follows ─────────────────────────────────────────────
#
# The synthesis stage, end to end: arm -> rail -> three gantries -> rail
# to the far end. Five cells across two NUCs, strictly sequential.
#
#   1. cell6's FR5 arm runs Task1.lua and finishes.
#   2. cell4's rail carries the balance (and the vial on it) under cell1.
#   3. cell1 lowers its head over the vial and its syringe pump dispenses.
#   4. cell2 and cell3 repeat the approach AND DISPENSE. Two more
#      syringe pumps were fitted on 2026-09-02, so all three cells now
#      run the same block: initialize, descend, dispense, retract. Until
#      then these two were motion-only, holding two seconds at depth
#      where the dispense now happens.
#   5. The rail runs to its end position.
#
# ── WHY EVERY POSITION HERE IS A MEASUREMENT ────────────────────────────
# Taught on 2026-08-13 with claude_test/test_teach_positions_shinyeong.py
# and recorded in claude_test/taught_positions_shinyeong.md. Every number
# below is an encoder readback the cell confirmed, never a commanded
# value. Before this the rail had only ever run 5..50 mm; the stations
# are at 471, 710 and 960 mm, so nearly all of this travel was unmeasured
# ground until that session.
#
# The rail's mechanical end is at 980.214 mm — found by commanding 990
# and getting a stall. `rail_end_mm` is 970, ten millimetres short of it,
# because parking against the hard stop is what raised the amp fault that
# then refused the next move.
#
# ── SAFETY, AND WHY THE ORDER IS WHAT IT IS ─────────────────────────────
#  1. THE RAIL CANNOT BE STOPPED FROM SOFTWARE AT ALL (GAP-1), and a
#     gantry stop queues behind the move it means to interrupt (GAP-9).
#     The physical e-stop is the only stop. An operator stays at the
#     bench for the whole run.
#  2. THE GANTRY HEAD SITS IN THE RAIL'S PATH. Every rail move below is
#     preceded by an assert that the gantry that just worked has its Z
#     back at 0. That assert is the only thing standing between a taught
#     run and the balance being driven into a head — L2's lock is per
#     cell and models no shared workspace (GAP-8).
#  3. THE HEAD MUST HOVER, NEVER TOUCH. `c*_z_mm` was taught to stop
#     above the vial. The balance is a BCE224I with a 220 g pan; a head
#     resting on it is an expensive repair. In --step-mode, look at the
#     gap before releasing each descent.
#  4. NO PARALLEL BLOCK ANYWHERE. arm, rail and gantries share bench
#     space that has never been measured (GAP-8), so the whole chain is
#     sequential by construction.
#  5. cell2/cell3 Z is INHERITED FROM cell1, not taught on their own
#     hardware — the operator's decision, on the grounds that the three
#     frames are built alike. If either of those frames sits lower
#     relative to the rail, this is where that shows up. Their descents
#     are the two steps to watch hardest on the first run.
#
# ── THE RAIL MUST START NEAR HOME ───────────────────────────────────────
# With cell4's amp powered the RS485 link drops periodically (LP #20). A
# rail move that straddles a drop aborts by design; the documented
# workaround is to hand-park the carriage near home so the homing travel
# fits in one quiet window (README "Bench notes", commit e95fb8c). The
# first pause below asks for exactly that. Long moves are then split into
# ~100 mm segments with `on_fail: retry` — every target is absolute, so a
# retry finishes an interrupted move rather than repeating a relative one.
#
# ── IF THE AMP WAS POWER-CYCLED ─────────────────────────────────────────
# Clearing an amp fault by cutting power ALSO CLEARS THE ENCODER ZERO,
# and every number in this file becomes meaningless. The first pause asks
# the operator to confirm the rail has been re-homed since any such
# power cycle. No code here can detect it.
#
# ── THE RUN HOMES THE GANTRIES ITSELF, AND PARKS THEM AFTERWARDS ────────
# Added 2026-08-27. Before this the run trusted whatever origin the three
# gantries were holding, and on that day all three were holding the wrong
# one: cell1's X had zeroed on the FAR end-stop, so `x_mm: 260` commanded
# it back into the limit it was already resting on, the encoder never left
# 0, and the run died at cell1_x_over_vial. No assert could have caught it
# -- an encoder reading 0 at the wrong end looks exactly like one reading 0
# at the right end.
#
# So the run now establishes its own frame (init_home_cell1..3) and leaves
# the heads at X 0 when it finishes (park_cell1..3). The two go together:
# parking is what makes the stored origin survive a power cycle, since a
# power-up re-zeros each encoder WHERE IT STANDS. Cost is about two
# minutes of homing at the front and half a minute of parking at the back.
#
# If a gantry cannot find its switch the run aborts there, before any
# taught coordinate is used. That is the intent -- a gantry with no
# coordinate frame has no business descending 215 mm onto a vial.

# Run it as: dry run -> step_mode -> real.
#   python -m orchestrator validate scenarios/test_synthesis_seq_shinyeong.yaml
#   python -m orchestrator run scenarios/test_synthesis_seq_shinyeong.yaml --step-mode

name: test_synthesis_to_analysis_nocell1_shinyeong
description: "The synthesis stage, then the hand-off to analysis. Identical to test_synthesis_seq_free_shinyeong\
  \ up to the rail's run to its end position; the rail then STAYS there instead of returning home, the\
  \ gantries park, and cell7's FR5 arm (192.168.0.59) runs pick_and_place_vial.lua and then pick_and_place_head.lua.\n\
  \ [cell1 skipped]"
params:
  program: Task1_original.lua
  arm_last_line: 29
  arm_min_elapsed_s: 20.0
  analysis_program_vial: pick_and_place_vial.lua
  analysis_program_head: pick_and_place_head.lua
  analysis_vial_last_line: 25
  analysis_vial_min_s: 10.0
  analysis_head_last_line: 31
  analysis_head_min_s: 10.0
  analysis_program_zensor: zensor.lua
  analysis_zensor_last_line: 16
  analysis_zensor_min_s: 10.0
  analysis_program_wash: ZensorWash.lua
  analysis_program_init_head: init_head.lua
  analysis_init_head_last_line: 28   # 2026-09-30: measured 28 lines / 14.7 s on run 20260930T152501Z
  analysis_init_head_min_s: 10.0
  analysis_wash_last_line: 61
  analysis_wash_min_s: 55.0
  rail_home_mm: 17.98   # 2026-09-30: +17.98 (rail re-zeroed at the stop; was 5.0)
  rail_cell1_mm: 491.752   # 2026-09-30: +17.98 (rail re-zeroed at the stop; was 473.772)
  rail_cell2_mm: 729.246   # 2026-09-30: +17.98 (rail re-zeroed at the stop; was 711.266)
  rail_cell3_mm: 947.5   # 2026-09-30: taught by eye with the head at depth (landed 947.44); was 952.009
  rail_end_mm: 978.0   # 2026-09-30: as close to the hard stop (980.37, measured today) as the 2 mm driver tolerance allows; 987.98 stalled, 980.369 IS the stop
  c1_x_mm: 249.985
  c1_z_mm: 225.0
  c2_x_mm: 250.004
  c2_z_mm: 225.0
  c3_x_mm: 243.0   # 2026-09-30: -2 mm by eye at depth (was 245.002)
  c3_z_mm: 223.0
  z_up_mm: 3.0
  volume_uL: 100.0
  source_port: 1
  dispense_port: 2
  init_force: 2
  rail_tol_mm: 2.0
  gantry_tol_mm: 0.5
  speed_pct: 10
  accel_pct: 0
defaults:
  on_fail: abort
  timeout_s: 30.0
steps:
- id: diag_cell6
  cell: cell6
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d6
- id: diag_cell7
  cell: cell7
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d7
- id: diag_cell4
  cell: cell4
  action: diagnose
  method: GET
  timeout_s: 30.0
  save_as: d4
- id: diag_cell2
  cell: cell2
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d2
- id: diag_cell3
  cell: cell3
  action: diagnose
  method: GET
  timeout_s: 20.0
  save_as: d3
- id: verify_arm_ready
  assert: ${d6.arm.ok} == True and ${d6.arm.ready} == True and ${d6.program.running} == False
- id: verify_arm7_ready
  assert: ${d7.arm.ok} == True and ${d7.arm.ready} == True and ${d7.program.running} == False
- id: verify_rail_and_balance
  assert: ${d4.stage.ok} == True and ${d4.balance.ok} == True
- id: verify_cell23_gantries
  assert: ${d2.stage.ok} == True and ${d3.stage.ok} == True and ${d2.pump.present} == True and ${d3.pump.present}
    == True
- id: verify_all_gantries_up
  assert: ${d2.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${d2.stage.z_b_mm} <=
    ${params.z_up_mm} + ${params.gantry_tol_mm} and ${d3.stage.z_a_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
    and ${d3.stage.z_b_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
- id: init_home_cell2
  cell: cell2
  action: gantry/home
  timeout_s: 180.0
  save_as: h2
- id: verify_init_cell2
  assert: ${h2.x_mm} <= ${params.gantry_tol_mm} and ${params.gantry_tol_mm} + ${h2.x_mm} >= 0 and ${h2.z_mm}
    <= ${params.gantry_tol_mm}
- id: init_home_cell3
  cell: cell3
  action: gantry/home
  timeout_s: 180.0
  save_as: h3
- id: verify_init_cell3
  assert: ${h3.x_mm} <= ${params.gantry_tol_mm} and ${params.gantry_tol_mm} + ${h3.x_mm} >= 0 and ${h3.z_mm}
    <= ${params.gantry_tol_mm}
# 2026-09-30: rail home moved ahead of the arm (see the original file's note).
- id: rail_home
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_home_mm}   # 2026-09-30: was linear/home (server home_mm 5.0)
  timeout_s: 180.0
  save_as: railed
- id: verify_railed
  assert: ${railed.y_mm} - ${params.rail_home_mm} <= ${params.rail_tol_mm} and ${params.rail_home_mm}
    - ${railed.y_mm} <= ${params.rail_tol_mm}
- id: rail_park_home
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_home_mm}
  timeout_s: 240.0
  on_fail: retry
  retries: 2
- id: arm_enable
  cell: cell6
  action: arm/enable
  save_as: en
- id: verify_enabled
  assert: ${en.fault_cleared} == True
- id: arm_program
  cell: cell6
  action: arm/program
  body:
    name: ${params.program}
  timeout_s: 360.0
  save_as: prog
- id: verify_arm_done
  assert: ${prog.completed} == True and ${prog.last_line} >= ${params.arm_last_line} and ${prog.elapsed_s}
    >= ${params.arm_min_elapsed_s}
- id: rail_at_cell2
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_cell2_mm}
  timeout_s: 240.0
  on_fail: retry
  retries: 2
  save_as: rail2
- id: verify_rail_at_cell2
  assert: ${rail2.y_mm} - ${params.rail_cell2_mm} <= ${params.rail_tol_mm} and ${params.rail_cell2_mm}
    - ${rail2.y_mm} <= ${params.rail_tol_mm}
- id: cell2_pump_init
  cell: cell2
  action: pump/initialize
  body:
    force: ${params.init_force}
  timeout_s: 60.0
  save_as: p2init
- id: verify_pump2_initialised
  assert: ${p2init.plunger_uL} == 0
- id: cell2_x_over_vial
  cell: cell2
  action: gantry/move
  body:
    x_mm: ${params.c2_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c2x
- id: verify_cell2_over_vial
  assert: ${c2x.x_mm} - ${params.c2_x_mm} <= ${params.gantry_tol_mm} and ${params.c2_x_mm} - ${c2x.x_mm}
    <= ${params.gantry_tol_mm}
- id: cell2_descend
  cell: cell2
  action: gantry/move
  body:
    x_mm: ${params.c2_x_mm}
    z_mm: ${params.c2_z_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c2z
- id: verify_cell2_descended
  assert: ${c2z.z_mm} - ${params.c2_z_mm} <= ${params.gantry_tol_mm} and ${params.c2_z_mm} - ${c2z.z_mm}
    <= ${params.gantry_tol_mm}
- id: cell2_dispense
  cell: cell2
  action: pump/cycle
  body:
    cycles: 1
    volume_uL: ${params.volume_uL}
    source_port: ${params.source_port}
    dispense_port: ${params.dispense_port}
  timeout_s: 180.0
  save_as: disp2
- id: verify_dispensed2
  assert: ${disp2.cycles_done} == 1
- id: cell2_retract
  cell: cell2
  action: gantry/move
  body:
    x_mm: ${params.c2_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c2up
- id: cell2_status
  cell: cell2
  action: status
  method: GET
  timeout_s: 20.0
  save_as: c2s
- id: verify_cell2_clear
  assert: ${c2s.stage_z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${c2s.error} == null
- id: rail_at_cell3
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_cell3_mm}
  timeout_s: 240.0
  on_fail: retry
  retries: 2
  save_as: rail3
- id: verify_rail_at_cell3
  assert: ${rail3.y_mm} - ${params.rail_cell3_mm} <= ${params.rail_tol_mm} and ${params.rail_cell3_mm}
    - ${rail3.y_mm} <= ${params.rail_tol_mm}
- id: cell3_pump_init
  cell: cell3
  action: pump/initialize
  body:
    force: ${params.init_force}
  timeout_s: 60.0
  save_as: p3init
- id: verify_pump3_initialised
  assert: ${p3init.plunger_uL} == 0
- id: cell3_x_over_vial
  cell: cell3
  action: gantry/move
  body:
    x_mm: ${params.c3_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c3x
- id: verify_cell3_over_vial
  assert: ${c3x.x_mm} - ${params.c3_x_mm} <= ${params.gantry_tol_mm} and ${params.c3_x_mm} - ${c3x.x_mm}
    <= ${params.gantry_tol_mm}
- id: cell3_descend
  cell: cell3
  action: gantry/move
  body:
    x_mm: ${params.c3_x_mm}
    z_mm: ${params.c3_z_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c3z
- id: verify_cell3_descended
  assert: ${c3z.z_mm} - ${params.c3_z_mm} <= ${params.gantry_tol_mm} and ${params.c3_z_mm} - ${c3z.z_mm}
    <= ${params.gantry_tol_mm}
- id: cell3_dispense
  cell: cell3
  action: pump/cycle
  body:
    cycles: 1
    volume_uL: ${params.volume_uL}
    source_port: ${params.source_port}
    dispense_port: ${params.dispense_port}
  timeout_s: 180.0
  save_as: disp3
- id: verify_dispensed3
  assert: ${disp3.cycles_done} == 1
- id: cell3_retract
  cell: cell3
  action: gantry/move
  body:
    x_mm: ${params.c3_x_mm}
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c3up
- id: cell3_status
  cell: cell3
  action: status
  method: GET
  timeout_s: 20.0
  save_as: c3s
- id: verify_cell3_clear
  assert: ${c3s.stage_z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm} and ${c3s.error} == null
- id: rail_to_end
  cell: cell4
  action: linear/move
  body:
    y_mm: ${params.rail_end_mm}
  timeout_s: 240.0
  on_fail: retry
  retries: 2
  save_as: railend
- id: verify_rail_at_end
  assert: ${railend.y_mm} - ${params.rail_end_mm} <= ${params.rail_tol_mm} and ${params.rail_end_mm} -
    ${railend.y_mm} <= ${params.rail_tol_mm}
- id: cell3_x_home
  cell: cell3
  action: gantry/move
  body:
    x_mm: 0.0
    z_mm: ${params.z_up_mm}
    speed_pct: ${params.speed_pct}
    accel_pct: ${params.accel_pct}
  timeout_s: 120.0
  save_as: c3home
- id: verify_cell3_x_home
  assert: ${c3home.x_mm} <= ${params.gantry_tol_mm} and ${c3home.z_mm} <= ${params.z_up_mm} + ${params.gantry_tol_mm}
- id: arm7_enable
  cell: cell7
  action: arm/enable
  save_as: en7
- id: verify_arm7_enabled
  assert: ${en7.fault_cleared} == True
- id: arm7_pick_and_place_vial
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_vial}
  timeout_s: 360.0
  save_as: prog7v
- id: verify_arm7_vial
  assert: ${prog7v.completed} == True and ${prog7v.last_line} >= ${params.analysis_vial_last_line} and
    ${prog7v.elapsed_s} >= ${params.analysis_vial_min_s}
- id: arm7_pick_and_place_head
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_head}
  timeout_s: 360.0
  save_as: prog7h
- id: verify_arm7_head
  assert: ${prog7h.completed} == True and ${prog7h.last_line} >= ${params.analysis_head_last_line} and
    ${prog7h.elapsed_s} >= ${params.analysis_head_min_s}
- id: arm7_zensor
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_zensor}
  timeout_s: 360.0
  save_as: prog7z
- id: verify_arm7_zensor
  assert: ${prog7z.completed} == True and ${prog7z.last_line} >= ${params.analysis_zensor_last_line} and
    ${prog7z.elapsed_s} >= ${params.analysis_zensor_min_s}
- id: arm7_zensor_wash
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_wash}
  timeout_s: 360.0
  save_as: prog7w
- id: verify_arm7_wash
  assert: ${prog7w.completed} == True and ${prog7w.last_line} >= ${params.analysis_wash_last_line} and
    ${prog7w.elapsed_s} >= ${params.analysis_wash_min_s}
- id: arm7_init_head
  cell: cell7
  action: arm/program
  body:
    name: ${params.analysis_program_init_head}
  timeout_s: 360.0
  save_as: prog7i
- id: verify_arm7_init_head
  assert: ${prog7i.completed} == True and ${prog7i.last_line} >= ${params.analysis_init_head_last_line} and ${prog7i.elapsed_s} >= ${params.analysis_init_head_min_s}
- id: shutdown_rail_home_and_gantry_init
  parallel:
  - id: rail_home_shutdown
    cell: cell4
    action: linear/move
    body:
      y_mm: ${params.rail_home_mm}
    timeout_s: 240.0
    on_fail: retry
    retries: 2
    save_as: railback
  - id: init_cell2_shutdown
    cell: cell2
    action: gantry/home
    timeout_s: 180.0
    save_as: h2end
  - id: init_cell3_shutdown
    cell: cell3
    action: gantry/home
    timeout_s: 180.0
    save_as: h3end
- id: verify_shutdown
  assert: ${railback.y_mm} - ${params.rail_home_mm} <= ${params.rail_tol_mm} and ${params.rail_home_mm}
    - ${railback.y_mm} <= ${params.rail_tol_mm} and ${h2end.z_mm} <= ${params.gantry_tol_mm} and ${h3end.z_mm}
    <= ${params.gantry_tol_mm}
- id: final_rail
  cell: cell4
  action: status
  method: GET
  timeout_s: 20.0
  save_as: fr
- id: verify_end_state
  assert: ${fr.stage_x_mm} - ${params.rail_home_mm} <= ${params.rail_tol_mm} and ${params.rail_home_mm}
    - ${fr.stage_x_mm} <= ${params.rail_tol_mm}
