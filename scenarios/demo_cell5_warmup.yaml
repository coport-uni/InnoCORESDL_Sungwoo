# Cell 5 (cell5) bring-up demo: single Z + hotplate + IR lamp in one run.
#
# Field names were taken from server/schemas.py, not guessed:
#   zstage/move        -> {z_mm, speed_pct, accel_pct}
#   hotplate/temperature -> {celsius}
#   hotplate/heater    -> {enabled}      NOT {on}: YAML 1.1 resolves a bare
#   lamp/switch        -> {enabled}      `on:` key to the boolean True, so
#                                        the field would be unreachable
#                                        from a scenario (LearnedPatterns #8).
#
# The scenario language now has a `wait_s` step (spec section 8.1;
# demo_cell5_hotplate_30c.yaml uses it for a fixed 10 s soak). This
# scenario predates it and keeps the operator-paced hold instead: the run
# pauses after `heat_on` in --step-mode, you watch the plate reach
# temperature, then resume. Do not run this scenario unattended -- it
# energizes a heater and a lamp.
#
# Run it as: dry run -> real step_mode -> real.
#   python -m orchestrator validate scenarios/demo_cell5_warmup.yaml
#   python -m orchestrator run scenarios/demo_cell5_warmup.yaml --step-mode
#
# Before the first run:
#   1. Confirm the safe Z travel with the operator and set lift_mm.
#   2. Confirm [hotplate] max_celsius in server/nuc2/cell5.toml is at or
#      below what this bench's chemistry needs; the cell rejects anything
#      above it with a 400 before touching the device.
#   3. Clear anything flammable from around the IR lamp.

# ── Running this scenario ───────────────────────────────────────────────
#
# 1. One cell server per cell this scenario names. Each is its own
#    process and owns its devices — start them in separate terminals
#    (or as `deploy/systemd/cell@.service` units) and leave them up.
#    `--cell` is not needed: the shape is inferred from the config's
#    device tables.
#
#      conda activate sdl
#      cd ~/workspace/InnoCOREServer/InnoCORESDL_Sungwoo
#      # server/nuc2/cell5.toml does not exist yet:
#      #   cp server/nuc2/cell5.toml.example server/nuc2/cell5.toml
#      python -m server --config server/nuc2/cell5.toml
#
#    Ports: cell5=17062. cell5 = pump + Z + hotplate + lamp.
#
# 2. Check each server is up and sees its hardware BEFORE any motion.
#    `diagnose` is the last gate that can catch a device that answers
#    reads but will not move:
#
#      curl -s localhost:17062/v1/health
#      curl -s localhost:17062/v1/diagnose | python3 -m json.tool
#
# 3. The orchestrator reads its cell list from orchestrator/config.toml.
#    Every cell above must be registered AND UNCOMMENTED there:
#
#      [cells.cell5]
#      base_url = "http://127.0.0.1:17062"
#
#    Some cells ship commented out on purpose, with the reason next to
#    them — a registered-but-down cell costs a connect timeout on every
#    `/v1/cells` probe and on every `stop_on_failure` broadcast, because
#    the engine POSTs /v1/stop to every REGISTERED cell, not only the
#    ones a run touched. So uncomment a cell together with its server,
#    and comment it back out when you power that bench down.
#
# 4. Dry run first — it validates every action and body field against
#    each cell's live OpenAPI, and moves nothing:
#
#      python -m orchestrator validate scenarios/demo_cell5_warmup.yaml
#
# 5. Then the real run. The first hardware-touching step waits for
#    an operator confirmation.
#
#      python -m orchestrator run scenarios/demo_cell5_warmup.yaml
#
#    Add `--step-mode` to pause before EVERY step. Use it only
#    when debugging: thirteen prompts of which one matters is how
#    an operator stops reading them.
#
#    A runlog is written to `runs/<UTC>-<name>/` (gitignored):
#    meta.json, run.jsonl, scenario.yaml, vars.json.
#
# Stopping a server: Ctrl-C in its terminal, or find the pid with
# `pgrep -af 'm server --config'` and `kill <pid>`. Do NOT use
# `pkill -f 'server --config'` — the pattern matches your own shell.
#
# ──────────────────────────────────────────────────────────────────────────

name: cell5_warmup
description: >
  Cell 5 bring-up: raise the Z stage, set the hotplate to a mild setpoint
  and confirm it took, blink the IR lamp, then leave everything off and
  the stage back home.

params:
  lift_mm: 10.0
  warm_c: 30.0

defaults:
  on_fail: abort        # never retry a motion or a heater command blindly
  timeout_s: 30.0

steps:
  - id: check_status
    cell: cell5
    action: status
    method: GET
    # 15 s, not 5 s: a status read reaches the amp over RS485, where a
    # slow-but-successful exchange measured 2078 ms and the driver may
    # retry it three times. 5 s looked generous against a 27 ms median
    # and cost a run its first step.
    timeout_s: 15.0
    save_as: pre

  - id: home_z
    cell: cell5
    action: zstage/home
    timeout_s: 60.0     # calibrate from the M0/A3 measurement

  - id: lift
    cell: cell5
    action: zstage/move
    body:
      z_mm: "${params.lift_mm}"
    timeout_s: 60.0
    save_as: lifted

  - id: verify_lift
    assert: "${lifted.z_mm} >= ${params.lift_mm} - 0.1"

  - id: set_setpoint
    cell: cell5
    action: hotplate/temperature
    body:
      celsius: "${params.warm_c}"
    save_as: setpoint

  - id: verify_setpoint
    assert: "${setpoint.target_c} == ${params.warm_c}"

  # The heater starts here. In --step-mode the run pauses after this step,
  # which is where the operator watches the plate warm up.
  - id: heat_on
    cell: cell5
    action: hotplate/heater
    body:
      enabled: true
    save_as: heating

  - id: read_hotplate
    cell: cell5
    action: hotplate/state
    method: GET
    save_as: hp

  - id: verify_heating
    assert: "${hp.heating} == True and ${hp.target_c} == ${params.warm_c}"

  - id: heat_off
    cell: cell5
    action: hotplate/heater
    body:
      enabled: false

  - id: lamp_on
    cell: cell5
    action: lamp/switch
    body:
      enabled: true
    save_as: lamp

  - id: verify_lamp
    assert: "${lamp.is_on} == True"

  - id: lamp_off
    cell: cell5
    action: lamp/switch
    body:
      enabled: false

  # Leave the cell in a safe state: heater off, lamp off, stage home.
  - id: park_z
    cell: cell5
    action: zstage/home
    timeout_s: 60.0
