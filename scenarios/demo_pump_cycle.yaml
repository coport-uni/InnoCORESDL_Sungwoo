# cell1 syringe-pump validation: initialize, then 10 aspirate->dispense
# cycles from valve port 1 (source) to valve port 3 (sink).
#
# VALVE GOTCHA -- READ BEFORE TRUSTING WHAT THIS PROVES.
#   The pump's valve is a Runze M05 Bi-pass with only two fluid states,
#   90 degrees apart. Firmware ports 1 and 3 sit 180 degrees apart, so
#   they map to the SAME fluid state (rotor symmetry -- LearnedPatterns
#   #1). This run therefore validates the CONTROL path -- valve rotation
#   confirmed by the driver's ?6 readback, plunger travel by its ?
#   readback, both surfaced through the L1 responses asserted below --
#   but the fluid path does NOT change between source and sink. 1 -> 3
#   is the requested validation pair; for a real liquid transfer use
#   ports 90 degrees apart (this bench: reservoir = 2, tip = 1) and
#   verify with the eye, not ?6.
#
# HOW THE 10 CYCLES ARE SPLIT
#   The scenario language has no loop construct (a scenario is data, not
#   code). Cycle 1 is unrolled step by step so every leg is asserted on
#   its own readback; the remaining 9 run inside one pump/cycle call,
#   whose L1 handler loops in the cell. 1 + 9 = the 10 requested
#   aspirations, and pump/cycle's cycles_done is asserted so a short
#   count cannot pass silently.
#
# BEFORE RUNNING
#   1. server/nuc1/cell1.toml must carry the [pump] table -- without it
#      every pump step here answers 409 ("configured without a pump").
#   2. If the lines are wet, the tip WILL take up and expel liquid at
#      the same port (see the gotcha above). Put a vessel under it.
#   3. The 9-cycle step holds the cell's single lock for its whole
#      duration, so /v1/stop queues behind it (docs/L1_AUDIT.md GAP-9).
#      Keep the physical e-stop / power switch in hand.
#   4. Run it in order:
#        python -m orchestrator validate scenarios/demo_pump_cycle.yaml
#        python -m orchestrator run scenarios/demo_pump_cycle.yaml --step-mode
#        python -m orchestrator run scenarios/demo_pump_cycle.yaml

name: demo_pump_cycle
description: >
  cell1's syringe pump under L2 control. Initializes the pump, runs one
  fully-asserted aspirate->dispense cycle from valve port 1 to port 3,
  then the remaining 9 cycles through pump/cycle -- 10 aspirations in
  all. Control-path validation only: ports 1 and 3 are the same fluid
  state on the M05 bi-pass valve.

params:
  # Half-ish of the 125 uL bench syringe: a real stroke, nowhere near
  # the limits, and quick enough that 10 cycles stay short.
  volume_uL: 100.0
  source_port: 1     # requested validation pair -- see the header note
  dispense_port: 3
  init_force: 2      # one-third init force, per the 125 uL syringe
  # Cycle 1 is unrolled below; 1 + 9 = the 10 requested aspirations.
  remaining_cycles: 9

defaults:
  on_fail: abort     # plunger and valve state carry across steps --
                     # never blindly retry a half-done pump command
  timeout_s: 30.0

steps:
  # ── Pre-flight: is the pump actually on this cell? ─────────────────
  - id: check_diagnose
    cell: cell1
    action: diagnose
    method: GET
    timeout_s: 15.0
    save_as: diag

  # present=false means cell1.toml lost its [pump] table again (the
  # SY-01B's USB link has a history of dropping -- ToDo.md). Catching it
  # here costs one HTTP call instead of ten 409s.
  - id: verify_pump_present
    assert: "${diag.pump.present} == true"

  # ok is the driver's read-only probe (version/status queries answered
  # sanely) -- the pump is talking, not just enumerated.
  - id: verify_pump_ok
    assert: "${diag.pump.ok} == true"

  # ── Initialize: home the plunger and valve ─────────────────────────
  - id: initialize
    cell: cell1
    action: pump/initialize
    body:
      force: "${params.init_force}"
    # A full-stroke plunger home is ~24 s at the init speed; the
    # driver's own settle timeout is 30 s, so sit above it.
    timeout_s: 60.0
    save_as: init

  - id: verify_plunger_homed
    assert: "${init.plunger_uL} == 0"

  # ── Cycle 1 of 10, unrolled and asserted leg by leg ────────────────
  # The valve response is the driver's ?6 readback AFTER its own
  # arrival poll -- asserting it means the valve reported the port,
  # not that the command was merely accepted.
  - id: c1_valve_source
    cell: cell1
    action: pump/valve
    body:
      port: "${params.source_port}"
    save_as: v_src

  - id: verify_c1_at_source
    assert: "${v_src.valve} == ${params.source_port}"

  - id: c1_aspirate
    cell: cell1
    action: pump/aspirate
    body:
      target_uL: "${params.volume_uL}"
    save_as: asp

  # aspirate is absolute ("contain this much"), and the response is the
  # cell's contained-volume state after the driver's ? position poll
  # confirmed arrival at the converted step target.
  - id: verify_c1_aspirated
    assert: "${asp.plunger_uL} == ${params.volume_uL}"

  - id: c1_valve_sink
    cell: cell1
    action: pump/valve
    body:
      port: "${params.dispense_port}"
    save_as: v_snk

  - id: verify_c1_at_sink
    assert: "${v_snk.valve} == ${params.dispense_port}"

  - id: c1_dispense
    cell: cell1
    action: pump/dispense
    body:
      target_uL: 0
    save_as: disp

  - id: verify_c1_emptied
    assert: "${disp.plunger_uL} == 0"

  # ── Cycles 2..10 in one call ───────────────────────────────────────
  # Worst case per cycle is two valve moves plus two full plunger
  # strokes (~27 s against the driver's settle timeouts); nine of
  # those need ~250 s, so 300 s gives margin without hiding a hang.
  - id: remaining_cycles
    cell: cell1
    action: pump/cycle
    body:
      cycles: "${params.remaining_cycles}"
      volume_uL: "${params.volume_uL}"
      source_port: "${params.source_port}"
      dispense_port: "${params.dispense_port}"
    timeout_s: 300.0
    save_as: cyc

  - id: verify_cycle_count
    assert: "${cyc.cycles_done} == ${params.remaining_cycles}"

  # The cell queries ?6 after the loop; every cycle ends on the
  # dispense port, so anything else means the loop broke off early.
  - id: verify_final_valve
    assert: "${cyc.final_valve} == ${params.dispense_port}"

  # ── Independent witness ────────────────────────────────────────────
  # /v1/status re-reads the valve over the wire rather than echoing
  # what pump/cycle just returned; plunger_uL confirms the syringe was
  # left empty for whoever runs next.
  - id: read_back
    cell: cell1
    action: status
    method: GET
    timeout_s: 15.0
    save_as: final

  - id: verify_syringe_left_empty
    assert: "${final.plunger_uL} == 0"

  - id: verify_status_agrees_on_valve
    assert: "${final.valve} == ${params.dispense_port}"
