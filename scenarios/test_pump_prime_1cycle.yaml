# cell1 syringe-pump single-shot check: initialize, then ONE fully
# asserted aspirate->dispense cycle.
#
# This is demo_pump_cycle.yaml with the batched step (pump/cycle) removed.
# That step's schema is `cycles: ge=1`, so the demo's floor is two cycles
# (1 unrolled + 1 batched); use this file when exactly one is wanted.
# Every other step and assert is identical to the demo's.
#
# FIRMWARE COMMAND DIGITS ARE NOT PHYSICAL FITTINGS -- LearnedPatterns #1.
#   The valve is a Runze M05 Bi-pass with only TWO fluid states, 90
#   degrees apart, HIL-mapped on this pump (fw 8.33):
#     command 1 (=3)  ->  C-1/2-3  ->  syringe <-> PHYSICAL port 1
#     command 2 (=4)  ->  C-3/1-2  ->  syringe <-> PHYSICAL port 3
#   Commands 180 degrees apart (1<->3, 2<->4) land on the same state, so
#   such a pair turns the rotor while the fluid path never changes. The
#   ?6 readbacks below prove rotor position; only the eye (the reservoir
#   level falling, drops at the tip) proves the transfer.
#
# BEFORE RUNNING
#   1. server/nuc1/cell1.toml must carry the [pump] table -- without it
#      every pump step here answers 409 ("configured without a pump").
#   2. This MOVES LIQUID: volume_uL is drawn from the reservoir
#      (physical port 1) and expelled at the tip (physical port 3),
#      125 uL by default. Reservoir stocked, vessel under the tip,
#      and watch it: the reservoir level must fall and a drop must
#      appear at the tip.
#   3. Keep the physical e-stop / power switch in hand.
#   4. Run it in order:
#        python -m orchestrator validate scenarios/test_pump_prime_1cycle.yaml
#        python -m orchestrator run scenarios/test_pump_prime_1cycle.yaml --step-mode
#        python -m orchestrator run scenarios/test_pump_prime_1cycle.yaml
#
# See demo_pump_cycle.yaml's header for the full "how to run a scenario"
# walkthrough (starting the cell server, registering it in
# orchestrator/config.toml, reading the runlog).

name: test_pump_prime_1cycle
description: >
  cell1's syringe pump, one priming cycle under L2 control. Initializes
  the pump, then draws volume_uL from the reservoir (physical port 1,
  valve command 1) and expels all of it at the tip (physical port 3,
  valve command 2). Each leg is asserted on the driver's own readback
  taken after its arrival poll, and /v1/status re-reads the hardware at
  the end as an independent witness.

params:
  # Full stroke on the 125 uL bench syringe. The driver's accepted range
  # is the closed interval [0, Config.syringe_uL], so this is the
  # boundary value and is valid. Drop to 120.0 to leave margin.
  volume_uL: 125.0
  source_port: 1     # COMMAND 1 -> syringe<->physical 1 = reservoir
  dispense_port: 2   # COMMAND 2 -> syringe<->physical 3 = tip
  # Z<force> homing code: 0 = full force (>=1 mL syringes), 1 = half
  # (250/500 uL), 2 = one-third (50-125 uL), 10..40 = S-code speed.
  # 2 protects the 125 uL barrel's top stop; keep in agreement with
  # the cell config's [pump] init_force.
  init_force: 2

defaults:
  on_fail: abort     # plunger and valve state carry across steps --
                     # never blindly retry a half-done pump command
  timeout_s: 30.0

steps:
  # ── Pre-flight: is the pump actually on this cell? ─────────────────
  - id: check_diagnose
    cell: cell1
    action: diagnose
    method: GET
    timeout_s: 15.0
    save_as: diag

  # present=false means cell1.toml lost its [pump] table again (the
  # SY-01B's USB link has a history of dropping -- ToDo.md). Catching it
  # here costs one HTTP call instead of several 409s.
  - id: verify_pump_present
    assert: "${diag.pump.present} == true"

  # ok is the driver's read-only probe (version/status queries answered
  # sanely) -- the pump is talking, not just enumerated.
  - id: verify_pump_ok
    assert: "${diag.pump.ok} == true"

  # ── Initialize: home the plunger and valve ─────────────────────────
  - id: initialize
    cell: cell1
    action: pump/initialize
    body:
      force: "${params.init_force}"
    # A full-stroke plunger home is ~24 s at the init speed; the
    # driver's own settle timeout is 30 s, so sit above it.
    timeout_s: 60.0
    save_as: init

  - id: verify_plunger_homed
    assert: "${init.plunger_uL} == 0"

  # ── The cycle, unrolled and asserted leg by leg ────────────────────
  # The valve response is the driver's ?6 readback AFTER its own arrival
  # poll -- asserting it means the valve reported the port, not that the
  # command was merely accepted.
  - id: valve_source
    cell: cell1
    action: pump/valve
    body:
      port: "${params.source_port}"
    save_as: v_src

  - id: verify_at_source
    assert: "${v_src.valve} == ${params.source_port}"

  - id: aspirate
    cell: cell1
    action: pump/aspirate
    body:
      target_uL: "${params.volume_uL}"
    save_as: asp

  # aspirate is absolute ("contain this much"), and the response is the
  # cell's contained-volume state after the driver's ? position poll
  # confirmed arrival at the converted step target.
  - id: verify_aspirated
    assert: "${asp.plunger_uL} == ${params.volume_uL}"

  - id: valve_sink
    cell: cell1
    action: pump/valve
    body:
      port: "${params.dispense_port}"
    save_as: v_snk

  - id: verify_at_sink
    assert: "${v_snk.valve} == ${params.dispense_port}"

  - id: dispense
    cell: cell1
    action: pump/dispense
    body:
      target_uL: 0
    save_as: disp

  - id: verify_emptied
    assert: "${disp.plunger_uL} == 0"

  # ── Independent witness ────────────────────────────────────────────
  # /v1/status re-reads the valve over the wire rather than echoing what
  # the dispense step just returned; plunger_uL confirms the syringe was
  # left empty for whoever runs next.
  - id: read_back
    cell: cell1
    action: status
    method: GET
    timeout_s: 15.0
    save_as: final

  - id: verify_syringe_left_empty
    assert: "${final.plunger_uL} == 0"

  - id: verify_status_agrees_on_valve
    assert: "${final.valve} == ${params.dispense_port}"
