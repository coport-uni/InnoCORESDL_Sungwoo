# First real-hardware L2 demo (spec section 8.3): the orchestrator drives
# cell4's MINAS A6 linear rail out and back over HTTP /v1 only.
#
# Action paths and body fields below were checked against the L1 code, not
# copied from the spec draft: server/routes.py exposes POST /v1/linear/home
# and POST /v1/linear/move, and LinearMoveRequest's field is `y_mm`.
# NOTE the asymmetry that GET /v1/status reports the rail position in
# `stage_x_mm` (StatusResponse has no y field) while linear/move answers
# with `y_mm` -- see LearnedPatterns.md #6.
#
# Before the first run:
#   1. Confirm the safe travel range with the operator and set target_mm.
#      50.0 is a placeholder (spec section 8.3).
#   2. Calibrate the timeouts from the M0/A3 measurement in
#      docs/L1_AUDIT.md -- move_to_mm is a converging closed loop, so its
#      settling time is measured, not assumed.
#   3. SAFETY: nothing in software can stop this rail once it is moving.
#      /v1/stop queues behind the in-flight command (GAP-9) AND
#      BalanceLinearCell.stop() is a no-op (GAP-1). The physical
#      interlock is the only stop. Do not run this scenario unattended.
#   4. Run it as: dry run -> real step_mode -> real.
#        python -m orchestrator validate scenarios/demo_linear_move.yaml
#        python -m orchestrator run scenarios/demo_linear_move.yaml --step-mode
#        python -m orchestrator run scenarios/demo_linear_move.yaml

# ── Running this scenario ───────────────────────────────────────────────
#
# 1. One cell server per cell this scenario names. Each is its own
#    process and owns its devices — start them in separate terminals
#    (or as `deploy/systemd/cell@.service` units) and leave them up.
#    `--cell` is not needed: the shape is inferred from the config's
#    device tables.
#
#      conda activate sdl
#      cd ~/workspace/InnoCOREServer/InnoCORESDL_Sungwoo
#      python -m server --config server/nuc1/cell4.toml
#
#    Ports: cell4=17060. cell4 = balance + linear Y rail.
#
# 2. Check each server is up and sees its hardware BEFORE any motion.
#    `diagnose` is the last gate that can catch a device that answers
#    reads but will not move:
#
#      curl -s localhost:17060/v1/health
#      curl -s localhost:17060/v1/diagnose | python3 -m json.tool
#
# 3. The orchestrator reads its cell list from orchestrator/config.toml.
#    Every cell above must be registered AND UNCOMMENTED there:
#
#      [cells.cell4]
#      base_url = "http://127.0.0.1:17060"
#
#    Some cells ship commented out on purpose, with the reason next to
#    them — a registered-but-down cell costs a connect timeout on every
#    `/v1/cells` probe and on every `stop_on_failure` broadcast, because
#    the engine POSTs /v1/stop to every REGISTERED cell, not only the
#    ones a run touched. So uncomment a cell together with its server,
#    and comment it back out when you power that bench down.
#
# 4. Dry run first — it validates every action and body field against
#    each cell's live OpenAPI, and moves nothing:
#
#      python -m orchestrator validate scenarios/demo_linear_move.yaml
#
# 5. Then the real run. The first hardware-touching step waits for
#    an operator confirmation.
#
#      python -m orchestrator run scenarios/demo_linear_move.yaml
#
#    Add `--step-mode` to pause before EVERY step. Use it only
#    when debugging: thirteen prompts of which one matters is how
#    an operator stops reading them.
#
#    A runlog is written to `runs/<UTC>-<name>/` (gitignored):
#    meta.json, run.jsonl, scenario.yaml, vars.json.
#
# Stopping a server: Ctrl-C in its terminal, or find the pid with
# `pgrep -af 'm server --config'` and `kill <pid>`. Do NOT use
# `pkill -f 'server --config'` — the pattern matches your own shell.
#
# ──────────────────────────────────────────────────────────────────────────

name: demo_linear_move
description: >
  L2's first real-hardware demo. The orchestrator homes cell4's linear
  rail, moves it to target_mm, verifies the reported position, and brings
  it back to 0 mm. Single cell, no balance, no lock contention.

params:
  target_mm: 50.0
  # 2.0 mm, matching the driver's default. This is not slack in the
  # assert -- it is the value the closed loop is driven to, and it must
  # not be tighter than what move_to_mm accepts or every run fails on a
  # rail the driver considers arrived. It is set above the measured
  # coast (1.5-1.8 mm at speed 25) so the loop converges on the first
  # coarse move instead of chattering with small corrections, which is
  # where every bench failure happened.
  tolerance_mm: 2.0
  # Where the rail rests, and NOT 0. The 0 mm encoder origin sits on the
  # mechanical stop; with the loop coasting 1.5-1.8 mm past its target, a
  # return to 0 pushes the carriage into the stop and holds it there
  # until the amp trips Err16.0 (motor overload). Must match `home_mm` in
  # the cell's config.
  home_mm: 5.0

defaults:
  on_fail: abort        # a motion step must never be retried blindly
  timeout_s: 30.0

steps:
  - id: check_status
    cell: cell4
    action: status
    method: GET
    # 15 s, not 5 s: a status read reaches the amp over RS485, where a
    # slow-but-successful exchange measured 2078 ms and the driver may
    # retry it three times. 5 s looked generous against a 27 ms median
    # and cost a run its first step.
    timeout_s: 15.0
    save_as: pre

  - id: home
    cell: cell4
    action: linear/home
    timeout_s: 60.0     # calibrate from M0/A3
    save_as: homed

  - id: verify_home
    assert: "${homed.y_mm} >= ${params.home_mm} - ${params.tolerance_mm} and ${homed.y_mm} <= ${params.home_mm} + ${params.tolerance_mm}"

  - id: move_out
    cell: cell4
    action: linear/move
    body:
      y_mm: "${params.target_mm}"
    timeout_s: 60.0     # calibrate from M0/A3
    save_as: at_target

  - id: verify_out
    assert: "${at_target.y_mm} >= ${params.target_mm} - ${params.tolerance_mm}"

  - id: read_back
    cell: cell4
    action: status
    method: GET
    # 15 s, not 5 s: a status read reaches the amp over RS485, where a
    # slow-but-successful exchange measured 2078 ms and the driver may
    # retry it three times. 5 s looked generous against a 27 ms median
    # and cost a run its first step.
    timeout_s: 15.0
    save_as: at_target_status

  # cell4's status reports the linear rail in stage_x_mm, not y_mm.
  - id: verify_status_agrees
    assert: "${at_target_status.stage_x_mm} >= ${params.target_mm} - ${params.tolerance_mm}"

  - id: move_back
    cell: cell4
    action: linear/move
    body:
      y_mm: "${params.home_mm}"
    timeout_s: 60.0     # calibrate from M0/A3
    save_as: post

  - id: verify_back_home
    assert: "${post.y_mm} >= ${params.home_mm} - ${params.tolerance_mm} and ${post.y_mm} <= ${params.home_mm} + ${params.tolerance_mm}"
